<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
</head>

<body>
<h2>결제 실패</h2>
<p id="code"></p>
<p id="message"></p>

<button onclick="goBackToProductList()">상품 목록으로 돌아가기</button>

<script>
    const urlParams = new URLSearchParams(window.location.search);

    const codeElement = document.getElementById("code");
    const messageElement = document.getElementById("message");

    codeElement.textContent = "에러코드: " + urlParams.get("code");
    messageElement.textContent = "실패 사유: " + urlParams.get("message");

    function goBackToProductList() {
        window.location.href = '/front/payment/productlist';
    }
</script>
</body>
</html>
